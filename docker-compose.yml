version: '1.0.0'

services:
  devforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: 0xshariq/devforge-cli:latest
    container_name: devforge-cli
    volumes:
      # Mount local directory for project development
      - ./projects:/home/pi/projects
      # Mount git config for authentication
      - ~/.gitconfig:/home/pi/.gitconfig:ro
      - ~/.ssh:/home/pi/.ssh:ro
    environment:
      - NODE_ENV=production
    working_dir: /home/pi/projects
    tty: true
    stdin_open: true
    networks:
      - devforge-network

  # Development service with hot reload
  devforge-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: 0xshariq/devforge-cli:dev
    container_name: devforge-cli-dev
    volumes:
      - .:/app
      - /app/node_modules
      - ./projects:/home/pi/projects
      - ~/.gitconfig:/home/pi/.gitconfig:ro
      - ~/.ssh:/home/pi/.ssh:ro
    environment:
      - NODE_ENV=development
    working_dir: /home/pi/projects
    tty: true
    stdin_open: true
    command: ["sh", "-c", "cd /app && npm run build && node dist/index.js"]
    networks:
      - devforge-network
    profiles:
      - dev

networks:
  devforge-network:
    driver: bridge

volumes:
  projects:
    driver: local